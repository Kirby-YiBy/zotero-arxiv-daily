name: Keep Alive

on:
  workflow_dispatch:
  schedule:
    # 每周两次（周一、周四 00:00 UTC）。GitHub 的定时任务本身会丢 tick，
    # 多给一次机会；keep-alive.txt 的内容只精确到"天"，同一天跑两次也只会提交一次。
    - cron: '0 0 * * 1'
    - cron: '0 0 * * 4'

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Update keep-alive file
        run: |
          mkdir -p .github
          echo "Last run: $(date -u +'%Y-%m-%d') UTC" > .github/keep-alive.txt
          echo "This file is automatically updated to keep the repository active and prevent GitHub Actions from disabling scheduled workflows." >> .github/keep-alive.txt

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/keep-alive.txt
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update keep-alive timestamp [skip ci]"
            git push
          fi
